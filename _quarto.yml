    center: "UMONS · Cours préparatoires au concours d'entrée en médecine et dentisterie"

filters:
  - at: pre-ast
    path: filtres/prepa.lua

format:
  html:
    theme: [cosmo, theme/polices.scss, theme/theme.scss, theme/prepa.scss, theme/onglet.scss]
    toc: true
    grid:
      sidebar-width: 250px
      body-width: 860px
      margin-width: 190px
      gutter-width: 1.5rem
    toc-title: Sur cette page
    toc-depth: 2
    number-sections: false
    html-math-method: mathjax
    include-in-header:
      - theme/includes/theme-init.html
      - theme/includes/typweb.html
    include-after-body:
      - theme/includes/aides.html
      - theme/includes/tools.html
      - theme/app.html
      - theme/includes/pdf-label.html
  typst:
    papersize: a4
    keep-typ: true
    font-paths: [fonts]
    margin:
      x: 2cm
      y: 2cm
    fontsize: 11pt
    include-in-header: theme/prepa.typ
