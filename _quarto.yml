project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!autoevaluation/"
  pre-render:
    - outils/index_questions.py
  post-render:
    - outils/pdf_complets.py
  resources:
    - etat.json
    - static/

lang: fr

website:
  title: "Prépa maths"
  page-navigation: true
  bread-crumbs: false
  sidebar:
    title: "Prépa maths"
    style: docked
    collapse-level: 1
    search: true
    contents:
      - text: Accueil
        href: index.qmd
      - text: "---"
      - text: "Chapitres"
      - section: "I · Algèbre"
        href: algebre/index.qmd
